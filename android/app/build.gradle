plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dsh.flipperbridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.dsh.flipperbridge"
        minSdk 23
        targetSdk 25
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
